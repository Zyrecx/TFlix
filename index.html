<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>TFlix - Smart TV Streaming</title>
  <!-- Every cold start hits both hosts for the home screen (API call, then
       poster images) — preconnecting overlaps their DNS/TLS handshakes with
       app boot instead of paying for them serially once the first fetch
       actually fires, which matters more on TV network stacks than desktop. -->
  <link rel="preconnect" href="https://api.themoviedb.org" />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
